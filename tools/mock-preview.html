<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 18px; font-family: system-ui, sans-serif;
    background: #f4f4f4;
    --card-background-color: #ffffff; --primary-text-color: #212121;
    --secondary-text-color: #727272; --divider-color: #e0e0e0;
    --warning-color: #ffa600; --error-color: #db4437; --success-color: #43a047; }
  body.dark { background: #111;
    --card-background-color: #1c1c1c; --primary-text-color: #e1e1e1;
    --secondary-text-color: #9b9b9b; --divider-color: #2c2c2c; }
  ha-card { display: block; background: var(--card-background-color);
    border-radius: 12px; border: 1px solid var(--divider-color); color: var(--primary-text-color); }
  .narrow { width: 460px; } .wideb { width: 940px; }
  h4 { color: #888; font: 500 11px system-ui; margin: 12px 2px 4px; }
</style>
</head>
<body>
<h4>wide (940px container)</h4><div class="wideb" id="w"></div>
<h4>normal (460px container)</h4><div class="narrow" id="n"></div>
<h4>sky map (520px container)</h4><div style="width:520px" id="sky"></div>
<h4>maturity (940px container)</h4><div class="wideb" id="mat"></div>
<h4>string × daypart (460px container)</h4><div class="narrow" id="sdp"></div>
<h4>maturity (460px container)</h4><div class="narrow" id="matn"></div>
<script type="module">
  import "/pvstrings-dash.js";
  if (new URLSearchParams(location.search).get("dark") === "1") document.body.classList.add("dark");
  // --- synthetic plant: forecast bell curve, 5-min power with noise ---
  const day = new Date(); day.setHours(0, 0, 0, 0);
  const d0 = day.getTime();
  const bell = (h) => Math.max(0, Math.sin((h - 5.5) / 15 * Math.PI)) ** 2 * 3.2;
  const forecast = [];
  for (let h = 0; h < 24; h++) {
    forecast.push({ datetime: new Date(d0 + h * 3600e3).toISOString(),
      potential_kwh: +bell(h).toFixed(3), unshaded_kwh: +(bell(h) * 1.12).toFixed(3) });
  }
  const nowH = 14.4;
  // synthetic sky map: an arc with an evening shadow, holes, and a low reference
  const cells = [];
  for (let az = 60; az <= 300; az += 10) {
    const elMax = Math.max(5, Math.round(50 * Math.sin((az - 50) / 260 * Math.PI) / 5) * 5);
    for (let el = 5; el <= elMax; el += 5) {
      if ((az === 130 && el > 20) || (az === 180 && el === 25)) continue; // unobserved holes
      const evening = az > 230 ? (az - 230) / 70 : 0;
      const low = el <= 15 ? (20 - el) / 20 : 0;
      const loss = Math.min(95, Math.round((evening * 60 + low * 45) * 10) / 10);
      cells.push({ az, el, loss, ratio: +(0.9 - loss / 200).toFixed(3),
        n: +(5 + Math.random() * 30).toFixed(1),
        season: az === 90 && el === 10 ? "ascending" : null });
    }
  }
  const states = {
    "sensor.s1_sky": { entity_id: "sensor.s1_sky", state: String(cells.length),
      attributes: { cells, reference_ratio: 0.87, friendly_name: "Strang Ost Himmelskarte" } },
    "sensor.s1_shading": { entity_id: "sensor.s1_shading", state: "12",
      attributes: { name: "Strang Ost", sun_azimuth: 205.4, sun_elevation: 34.2,
        observations: 5123, most_shaded: [], friendly_name: "Strang Ost Verschattung jetzt" } },
    "sensor.plant_fc": { entity_id: "sensor.plant_fc", state: "17.9",
      attributes: { forecast, friendly_name: "PV Anlage Prognose heute" } },
    "sensor.plant_prod": { entity_id: "sensor.plant_prod", state: "12.4",
      attributes: { friendly_name: "PV Anlage Ertrag heute" } },
    "sensor.plant_power": { entity_id: "sensor.plant_power", state: "2100",
      attributes: { unit_of_measurement: "W", friendly_name: "PV Anlage Leistung jetzt" } },
    // mid-training learning state: clear well-fed, rain barely seen
    "sensor.plant_mo": { entity_id: "sensor.plant_mo", state: "97.3",
      attributes: { friendly_name: "PV Anlage Modell-Beobachtungen", log_ratio: { plant: {
        "clear|morning": { factor: 1.04, n_eff: 20.0 },
        "clear|midday": { factor: 0.99, n_eff: 21.0 },
        "clear|afternoon": { factor: 1.07, n_eff: 18.0 },
        "partly_cloudy|morning": { factor: 1.12, n_eff: 15.0 },
        "partly_cloudy|midday": { factor: 1.02, n_eff: 12.0 },
        "partly_cloudy|afternoon": { factor: 0.94, n_eff: 9.0 },
        "overcast|morning": { factor: 1.21, n_eff: 6.0 },
        "overcast|midday": { factor: 1.15, n_eff: 4.0 },
        "overcast|afternoon": { factor: 1.3, n_eff: 2.0 },
        "rain|midday": { factor: 1.4, n_eff: 1.2 },
      }, string_daypart: {
        "s1|morning": { factor: 0.948, n_eff: 18.2 },
        // s1|midday absent: below the activation threshold, not "never seen"
        "s1|afternoon": { factor: 1.059, n_eff: 19.5 },
      } } } },
    // a mature learning state: all buckets near the ceiling (green zone)
    "sensor.plant_mo2": { entity_id: "sensor.plant_mo2", state: "241.8",
      attributes: { friendly_name: "PV Anlage Modell-Beobachtungen (reif)", log_ratio: { plant:
        Object.fromEntries(["clear", "partly_cloudy", "overcast", "rain"].flatMap((w) =>
          ["morning", "midday", "afternoon"].map((d) =>
            [`${w}|${d}`, { factor: 1.02, n_eff: 18 + ((w.length + d.length) % 5) }]))) } } },
    // a younger second string: half the sky seen so far
    "sensor.s2_sky": { entity_id: "sensor.s2_sky", state: String(cells.length >> 1),
      attributes: { cells: cells.filter((c, i) => i % 2 === 0), reference_ratio: 0.97,
        friendly_name: "Strang West Himmelskarte" } },
  };
  const entReg = [
    { entity_id: "sensor.s1_sky", platform: "pvstrings", device_id: "ds", unique_id: "e_s1_sky_map", translation_key: "sky_map" },
    { entity_id: "sensor.s1_shading", platform: "pvstrings", device_id: "ds", unique_id: "e_s1_shading_now", translation_key: "shading_now" },
    { entity_id: "sensor.plant_fc", platform: "pvstrings", device_id: "dp", unique_id: "e_forecast_today", translation_key: "forecast_today" },
    { entity_id: "sensor.plant_prod", platform: "pvstrings", device_id: "dp", unique_id: "e_produced_today", translation_key: "produced_today" },
    { entity_id: "sensor.plant_power", platform: "pvstrings", device_id: "dp", unique_id: "e_power_now", translation_key: "power_now" },
  ];
  const devReg = [
    { id: "dp", model: "PV plant", name: "PV Anlage", identifiers: [["pvstrings", "e"]] },
    { id: "ds", model: "PV string", name: "Strang Ost", via_device_id: "dp", identifiers: [["pvstrings", "e_s1"]] },
  ];
  const stats5 = [];
  for (let m = 0; m < nowH * 60; m += 5) {
    const h = m / 60;
    const noise = 1 + 0.35 * Math.sin(m / 7) * Math.random();
    stats5.push({ start: d0 + m * 60e3, end: d0 + (m + 5) * 60e3,
      mean: Math.round(bell(h) * 1000 * Math.max(0.2, noise)) });
  }
  const statsH = [];
  for (let h = 0; h < Math.floor(nowH); h++) {
    statsH.push({ start: d0 + h * 3600e3, end: d0 + (h + 1) * 3600e3, change: +bell(h).toFixed(3) });
  }
  const callWS = async (cmd) => {
    switch (cmd.type) {
      case "config/entity_registry/list": return entReg;
      case "config/device_registry/list": return devReg;
      case "recorder/statistics_during_period":
        return { [cmd.statistic_ids[0]]: cmd.period === "5minute" ? stats5 : statsH };
      default: return {};
    }
  };
  const hass = { states, callWS, language: "de", locale: { language: "de" },
    config: { time_zone: Intl.DateTimeFormat().resolvedOptions().timeZone, latitude: 53.6 },
    themes: { darkMode: true } };
  for (const [sel, tag, cfg] of [
      ["#w", "pvstrings-forecast", { entity: "sensor.plant_fc", days: 1, style: "line", wide: true, show_unshaded: false }],
      ["#n", "pvstrings-forecast", { entity: "sensor.plant_fc", days: 1, style: "line" }],
      ["#sky", "pvstrings-sky-map", { entity: "sensor.s1_sky" }],
      ["#sdp", "pvstrings-kv-table", { entity: "sensor.plant_mo",
        mode: "log_ratio_string_daypart", title: "Strang × Tagesabschnitt" }],
      ["#mat", "pvstrings-maturity", { entity: "sensor.plant_mo",
        rows: [{ name: "Strang Ost", sky: "sensor.s1_sky" }, { name: "Strang West", sky: "sensor.s2_sky" }] }],
      ["#matn", "pvstrings-maturity", { entity: "sensor.plant_mo2",
        rows: [{ name: "Strang Ost", sky: "sensor.s1_sky" }, { name: "Strang West", sky: "sensor.s2_sky" }] }]]) {
    const el = document.createElement(tag);
    el.setConfig(cfg); el.hass = hass;
    document.querySelector(sel).append(el);
  }
</script>
</body>
</html>
